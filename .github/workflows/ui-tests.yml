name: UI Tests

on:
  push:
    branches: [feature/runtime-profiler-v1]
    paths:
      - "UI/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "UI/**"
      - ".github/workflows/ui-tests.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: UI
    env:
      CSII_USERDATAPATH: ${{ github.workspace }}/.ci-userdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run UI tests
        run: npm test
      - name: Build UI bundle
        run: npm run build
